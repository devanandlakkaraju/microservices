spring:
  application:
    name: "configserver"
  profiles:
    active: "git"
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/devanandlakkaraju/microservices.git"
          default-label: devanandlakkaraju-microservices
          timeout: 5
          clone-on-start: true
          force-pull: true
  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

encrypt:
  key: "98765"

server:
  port: 8071

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}